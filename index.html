<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пример страницы</title>
    <link rel="stylesheet" href="style.css">
     <style>
    /* Изначально скрываем текст */
    #text {
      display: none;
    }
  </style>
  </head>
<body>
  <div class="container">
    <div class="left">
      <img alt = "картинка пингвина" src = "sticker233.webp" height="800px" width="400px">
    </div>
    <div class="right">
      <div class="speech-dark">
        Спишь?
      </div>
      <br>
      <div class="speech-orange">
        <h2>Чаю хочешь?</h2>
      </div>
      <div class="buttons">
        <button class="btn">Ну скажи - я красавчик!</button>
        <button class="btn">Красавчик же, ну!</button>
      </div>
      <div class="speech-orange">
      	 <div id="text">Ладно, идем!</div>
        <h2>Ладно, идем!</h2>
      </div>
    </div>
  </div>
</body>
</html>
